{% extends "base.html" %}
{% block head %}
<meta name="robots" content="NOINDEX, NOFOLLOW">
<link rel="stylesheet" href="/duplicity/styles.css">
{% endblock %}
{% block content %}
<div id="app" v-cloak>
  <div class="app-tools">
    <div id="tooltranslate_wrapper"></div>
    <widar>
      <template slot="loggedin">
        <a :href="userUrl" target="_blank" v-text="userName"></a>
      </template>
    </widar>
  </div>

  <router-view :key="$route.path"><p class="muted">Loading…</p></router-view>

  <div class="duplicity-error-toast-container" aria-live="polite" aria-atomic="true">
    <div v-for="(err, idx) in errors" :key="idx" class="duplicity-error-toast" role="alert">
      <div class="toast-body" v-text="err"></div>
      <button type="button" class="close" aria-label="Close" @click.prevent="dismissError(idx)">×</button>
    </div>
  </div>
</div>

<script src="https://tools-static.wmflabs.org/cdnjs/ajax/libs/vue/2.7.16/vue.min.js"></script>
<script src="https://tools-static.wmflabs.org/cdnjs/ajax/libs/vue-router/3.6.5/vue-router.min.js"></script>
<script src="https://tools-static.wmflabs.org/cdnjs/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
<script src="https://tools-static.wmflabs.org/magnustools/resources/js/flot/jquery.flot.min.js"></script>
<script type="module" src="/duplicity/app.js"></script>
{% endblock %}
